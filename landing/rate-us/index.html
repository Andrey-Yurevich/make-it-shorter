<p id="m">One moment…</p>
<script>
// ЗАГЛУШКА. Подставить реальные адреса перед выкатом.
var STORE_URL = 'https://chromewebstore.google.com/detail/__EXTENSION_ID__';
var FORM_URL  = 'https://docs.google.com/forms/__FORM_ID__/viewform';

var stars = parseInt(new URLSearchParams(location.search).get('stars'), 10);

if (!(stars >= 1 && stars <= 5)) {
  location.replace('/');
} else if (stars >= 4) {
  location.replace(STORE_URL);
} else {
  location.replace(FORM_URL + '?usp=pp_url&entry.__STARS_FIELD__=' + stars);
}
</script>
